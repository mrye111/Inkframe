<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inkframe — Home Prototype</title>
<style>
  /* ============ Design Tokens（内部设计规范） ============ */
  :root {
    --bg-0: #090A0D;
    --bg-1: #101218;
    --bg-2: #151821;
    --text-1: #F2F2F5;
    --text-2: #9A9AA5;
    --text-3: #62626C;
    --rec-red: #FF453A;
    --soft-blue: #5E8CE6;
    --soft-green: #63C28C;
    --r-card: 24px;
    --r-btn: 22px;
    --r-pill: 999px;
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Segoe UI Variable", "Microsoft YaHei UI", system-ui, sans-serif;
    background: var(--bg-1);
    color: var(--text-1);
    min-height: 100vh;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ============ 环境光（柔光理念：光来自上方） ============ */
  .ambient {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
  }
  .ambient::before {
    content: ""; position: absolute;
    top: -30%; left: 50%; transform: translateX(-50%);
    width: 1200px; height: 700px;
    background: radial-gradient(ellipse at center,
      rgba(94,140,230,0.055) 0%, rgba(94,140,230,0.02) 40%, transparent 70%);
  }
  .ambient::after {
    content: ""; position: absolute;
    bottom: -40%; right: -10%;
    width: 800px; height: 600px;
    background: radial-gradient(ellipse at center,
      rgba(255,69,58,0.025) 0%, transparent 60%);
  }

  /* ============ 布局 ============ */
  .stage {
    position: relative; z-index: 1;
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center;
    padding: 72px 48px 56px;
  }

  /* ============ Hero ============ */
  .hero {
    font-size: 38px; font-weight: 600;
    letter-spacing: -0.02em;
    background: linear-gradient(180deg, #FFFFFF 0%, #C8C9D0 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    opacity: 0; transform: translateY(12px);
    animation: rise 600ms var(--ease-out) 100ms forwards;
  }
  .hero-sub {
    margin-top: 12px;
    font-size: 13.5px; color: var(--text-2);
    letter-spacing: 0.01em;
    opacity: 0; transform: translateY(12px);
    animation: rise 600ms var(--ease-out) 200ms forwards;
  }

  /* ============ 模式卡 ============ */
  .modes {
    display: flex; gap: 24px;
    margin-top: 64px;
  }
  .card {
    position: relative;
    width: 236px; height: 232px;
    border-radius: var(--r-card);
    cursor: pointer;
    border: 1px solid transparent;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.075) 0%, rgba(255,255,255,0.03) 100%);
    transition: transform 260ms var(--ease-spring),
                background 260ms var(--ease-out),
                border-color 260ms var(--ease-out),
                box-shadow 260ms var(--ease-out);
    opacity: 0; transform: translateY(16px);
    animation: rise 600ms var(--ease-out) forwards;
    /* 玻璃边缘：顶亮侧弱底暗 */
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.10),
      inset 0 -1px 0 rgba(0,0,0,0.22),
      0 12px 32px rgba(0,0,0,0.28);
  }
  .card:nth-child(1) { animation-delay: 300ms; }
  .card:nth-child(2) { animation-delay: 380ms; }
  .card:nth-child(3) { animation-delay: 460ms; }

  .card:hover {
    transform: translateY(-4px);
    background: linear-gradient(180deg, rgba(255,255,255,0.105) 0%, rgba(255,255,255,0.045) 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.14),
      inset 0 -1px 0 rgba(0,0,0,0.22),
      0 20px 44px rgba(0,0,0,0.36);
  }
  .card:active { transform: translateY(-1px) scale(0.985); }

  /* 选中态：软蓝描边 + 顶部光带增强 */
  .card.selected {
    border-color: rgba(94,140,230,0.55);
    background: linear-gradient(180deg, rgba(94,140,230,0.14) 0%, rgba(94,140,230,0.05) 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.16),
      inset 0 -1px 0 rgba(0,0,0,0.22),
      0 16px 40px rgba(94,140,230,0.14),
      0 0 0 1px rgba(94,140,230,0.25);
  }

  .card-inner {
    height: 100%;
    display: flex; flex-direction: column;
    align-items: flex-start;
    padding: 24px;
  }

  .card-icon {
    width: 52px; height: 52px;
    border-radius: 14px;
    display: grid; place-items: center;
    background: linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0.04));
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.12);
    color: var(--text-1);
    transition: color 260ms var(--ease-out), transform 260ms var(--ease-spring);
  }
  .card.selected .card-icon { color: var(--soft-blue); }
  .card:hover .card-icon { transform: scale(1.06); }

  .card-title {
    margin-top: auto;
    font-size: 17px; font-weight: 600; letter-spacing: 0.01em;
  }
  .card-desc {
    margin-top: 6px;
    font-size: 12.5px; color: var(--text-2); line-height: 1.55;
  }
  .card.selected .card-title { color: #FFFFFF; }

  /* 选中角标 */
  .card-check {
    position: absolute; top: 16px; right: 16px;
    width: 22px; height: 22px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--soft-blue);
    color: #fff;
    opacity: 0; transform: scale(0.5);
    transition: opacity 220ms var(--ease-out), transform 300ms var(--ease-spring);
  }
  .card.selected .card-check { opacity: 1; transform: scale(1); }

  /* ============ 录制主按钮（玻璃胶囊） ============ */
  .record-btn {
    margin-top: 56px;
    position: relative;
    display: flex; align-items: center; gap: 12px;
    height: 56px; padding: 0 36px;
    border-radius: var(--r-btn);
    border: 1px solid transparent;
    cursor: pointer;
    font-family: inherit; font-size: 15px; font-weight: 500;
    color: var(--text-1);
    background: linear-gradient(180deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.05) 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.14),
      0 8px 24px rgba(0,0,0,0.30);
    transition: transform 200ms var(--ease-spring),
                background 220ms var(--ease-out),
                box-shadow 220ms var(--ease-out);
    opacity: 0;
    animation: rise 600ms var(--ease-out) 560ms forwards;
  }
  .record-btn:hover {
    background: linear-gradient(180deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0.075) 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.20),
      0 12px 32px rgba(0,0,0,0.38);
    transform: translateY(-1px);
  }
  .record-btn:active { transform: scale(0.96); }

  .rec-dot {
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--rec-red);
    box-shadow: 0 0 12px rgba(255,69,58,0.55);
    transition: all 300ms var(--ease-out);
  }
  .record-btn.recording .rec-dot {
    border-radius: 3px;
    box-shadow: 0 0 10px rgba(255,69,58,0.4);
    animation: pulse 1.6s ease-in-out infinite;
  }
  .record-btn.recording {
    border-color: rgba(255,69,58,0.35);
    background: linear-gradient(180deg, rgba(255,69,58,0.16) 0%, rgba(255,69,58,0.07) 100%);
  }

  /* ============ 状态行 ============ */
  .status {
    margin-top: 20px;
    font-size: 12px; color: var(--text-3);
    letter-spacing: 0.02em;
    opacity: 0;
    animation: rise 600ms var(--ease-out) 640ms forwards;
  }

  @keyframes rise {
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.45; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
  <div class="ambient"></div>

  <main class="stage">
    <h1 class="hero">Ready to record?</h1>
    <p class="hero-sub">选择一种方式，剩下的交给 Inkframe</p>

    <section class="modes" id="modes">
      <!-- 全屏 -->
      <div class="card selected" data-mode="fullscreen" tabindex="0" role="radio" aria-checked="true">
        <div class="card-check" aria-hidden="true">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <div class="card-inner">
          <div class="card-icon">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
          </div>
          <div class="card-title">全屏录制</div>
          <div class="card-desc">完整记录整个显示器<br>适合教程与演示</div>
        </div>
      </div>

      <!-- 窗口 -->
      <div class="card" data-mode="window" tabindex="0" role="radio" aria-checked="false">
        <div class="card-check" aria-hidden="true">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <div class="card-inner">
          <div class="card-icon">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><circle cx="6.5" cy="6.5" r="0.6" fill="currentColor"/><circle cx="9.5" cy="6.5" r="0.6" fill="currentColor"/></svg>
          </div>
          <div class="card-title">窗口录制</div>
          <div class="card-desc">只锁定一个应用窗口<br>其他内容不会入镜</div>
        </div>
      </div>

      <!-- 区域 -->
      <div class="card" data-mode="region" tabindex="0" role="radio" aria-checked="false">
        <div class="card-check" aria-hidden="true">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <div class="card-inner">
          <div class="card-icon">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M2 6h14a2 2 0 0 1 2 2v14"/></svg>
          </div>
          <div class="card-title">区域录制</div>
          <div class="card-desc">自由框选任意范围<br>精确到像素</div>
        </div>
      </div>
    </section>

    <button class="record-btn" id="recordBtn" aria-pressed="false">
      <span class="rec-dot"></span>
      <span id="btnText">Start Record</span>
    </button>

    <p class="status" id="status">全屏 · 1080P · 30 FPS · 系统声音 + 麦克风</p>
  </main>

<script>
  const cards = document.querySelectorAll('.card');
  const btn = document.getElementById('recordBtn');
  const btnText = document.getElementById('btnText');
  const status = document.getElementById('status');
  const modeNames = { fullscreen: '全屏', window: '窗口', region: '区域' };
  let mode = 'fullscreen';
  let recording = false;

  function select(card) {
    cards.forEach(c => { c.classList.remove('selected'); c.setAttribute('aria-checked', 'false'); });
    card.classList.add('selected');
    card.setAttribute('aria-checked', 'true');
    mode = card.dataset.mode;
    updateStatus();
  }

  function updateStatus() {
    if (recording) return;
    status.textContent = modeNames[mode] + ' · 1080P · 30 FPS · 系统声音 + 麦克风';
  }

  cards.forEach(c => {
    c.addEventListener('click', () => select(c));
    c.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(c); } });
  });

  btn.addEventListener('click', () => {
    recording = !recording;
    btn.classList.toggle('recording', recording);
    btn.setAttribute('aria-pressed', String(recording));
    btnText.textContent = recording ? 'Stop' : 'Start Record';
    status.textContent = recording
      ? '00:00:00 · ' + modeNames[mode] + '录制中'
      : '已保存到 视频/Inkframe · ' + modeNames[mode] + ' · 1080P 30FPS';
  });
</script>
</body>
</html>
